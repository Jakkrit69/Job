<div class="lp-root" id="lp-root">
  <div class="lp-veil"></div>
  <div class="lp-loading">กำลังโหลดข้อมูล...</div>
</div>

<script>
(function() {
  const THAI_MONTHS = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
  const THAI_MONTHS_FULL = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
  const STATUS_LABEL = { pending: "ค้าง", doing: "กำลังทำ", done: "เสร็จแล้ว" };
  const now = new Date();
  let state = { year: now.getFullYear(), monthIndex: now.getMonth(), tasks: [], lineConnected: false, loaded: false };

  const root = document.getElementById('lp-root');

  function monthKey(year, mIdx) { return year + "-" + String(mIdx + 1).padStart(2, "0"); }

  async function loadAll() {
    const [tasksRes, statusRes] = await Promise.all([
      fetch('/api/tasks').then(r => r.json()).catch(() => []),
      fetch('/api/status').then(r => r.json()).catch(() => ({ lineConnected: false })),
    ]);
    state.tasks = tasksRes;
    state.lineConnected = statusRes.lineConnected;
    state.loaded = true;
    render();
  }

  async function addTask(mKey, status, text) {
    if (!text || !text.trim()) return;
    const res = await fetch('/api/tasks', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: text.trim(), status, monthKey: mKey }),
    });
    const task = await res.json();
    state.tasks.push(task);
    render();
  }

  async function moveTask(id, dir) {
    const order = ["pending", "doing", "done"];
    const t = state.tasks.find(t => t.id === id);
    if (!t) return;
    const newIdx = order.indexOf(t.status) + dir;
    if (newIdx < 0 || newIdx > 2) return;
    t.status = order[newIdx];
    render();
    await fetch('/api/tasks/' + id, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status: t.status }) });
  }

  async function deleteTask(id) {
    state.tasks = state.tasks.filter(t => t.id !== id);
    render();
    await fetch('/api/tasks/' + id, { method: 'DELETE' });
  }

  function tasksForMonth(mKey) { return state.tasks.filter(t => t.monthKey === mKey); }

  function monthProgress(mKey) {
    const list = tasksForMonth(mKey);
    if (list.length === 0) return { pct: 0, total: 0 };
    const done = list.filter(t => t.status === "done").length;
    return { pct: Math.round((done / list.length) * 100), total: list.length };
  }

  function escapeHTML(str) { const d = document.createElement("div"); d.textContent = str; return d.innerHTML; }

  function render() {
    if (!state.loaded) {
      root.innerHTML = '<div class="lp-veil"></div><div class="lp-loading">กำลังโหลดข้อมูล...</div>';
      return;
    }
    const curKey = monthKey(state.year, state.monthIndex);
    const buddhistYear = state.year + 543;

    let monthGridHTML = "";
    for (let i = 0; i < 12; i++) {
      const mk = monthKey(state.year, i);
      const prog = monthProgress(mk);
      const active = i === state.monthIndex;
      monthGridHTML += `
        <div class="lp-month-pill ${active ? 'active' : ''}" data-month-idx="${i}">
          <span class="lp-m-name">${THAI_MONTHS[i]}</span>
          <div class="lp-m-bar"><div class="lp-m-bar-fill" style="width:${prog.pct}%"></div></div>
          <span class="lp-m-count">${prog.total ? prog.total + " งาน" : "—"}</span>
        </div>`;
    }

    const monthTotal = tasksForMonth(curKey).length;

    function columnHTML(status, dotClass) {
      const list = tasksForMonth(curKey).filter(t => t.status === status);
      let cards = list.map(t => {
        const canLeft = t.status !== "pending";
        const canRight = t.status !== "done";
        return `
          <div class="lp-task-card ${t.status}">
            <div class="lp-task-text">${escapeHTML(t.text)}</div>
            <div class="lp-task-actions">
              <div class="lp-move-btns">
                ${canLeft ? `<button data-move="-1" data-id="${t.id}">←</button>` : ""}
                ${canRight ? `<button data-move="1" data-id="${t.id}">→</button>` : ""}
              </div>
              <button class="lp-del-btn" data-del="${t.id}">ลบ</button>
            </div>
          </div>`;
      }).join("");
      if (!cards) cards = `<div class="lp-empty-hint">ยังไม่มีงานในหมวดนี้</div>`;
      return `
        <div class="lp-col">
          <div class="lp-col-head">
            <div class="lp-col-label"><span class="lp-dot ${dotClass}"></span>${STATUS_LABEL[status]}</div>
            <span class="lp-col-count">${list.length}</span>
          </div>
          <div class="lp-add-row">
            <input type="text" placeholder="เพิ่มงาน..." data-add-input="${status}" />
            <button data-add-btn="${status}">+</button>
          </div>
          <div class="lp-task-list">${cards}</div>
        </div>`;
    }

    root.innerHTML = `
      <div class="lp-veil"></div>
      <div class="lp-inner">
        <div class="lp-hero">
          <h1>สมุดงาน</h1>
        </div>
        <div class="lp-line-badge ${state.lineConnected ? 'on' : ''}">
          <span class="lp-b-dot"></span>
          ${state.lineConnected ? 'เชื่อมต่อ LINE แล้ว — พิมพ์ข้อความใน LINE เพื่อเพิ่มงาน' : 'ยังไม่เชื่อมต่อ LINE — เพิ่มบอทเป็นเพื่อนแล้วพิมพ์ทักไปครั้งนึง'}
        </div>
        <div class="lp-card">
          <div class="lp-toprow">
            <div class="lp-yearnav">
              <button data-year="-1">‹</button>
              ปี ${buddhistYear}
              <button data-year="1">›</button>
            </div>
          </div>
          <div class="lp-month-grid">${monthGridHTML}</div>
          <div class="lp-month-heading">
            ${THAI_MONTHS_FULL[state.monthIndex]} ${buddhistYear}
            <span class="lp-total">รวม ${monthTotal} งาน</span>
          </div>
          <div class="lp-columns">
            ${columnHTML("pending", "pending")}
            ${columnHTML("doing", "doing")}
            ${columnHTML("done", "done")}
          </div>
        </div>
      </div>
    `;
    bindEvents();
  }

  function bindEvents() {
    root.querySelectorAll('[data-month-idx]').forEach(el => el.addEventListener('click', () => { state.monthIndex = parseInt(el.getAttribute('data-month-idx'), 10); render(); }));
    root.querySelectorAll('[data-year]').forEach(el => el.addEventListener('click', () => { state.year += parseInt(el.getAttribute('data-year'), 10); render(); }));
    root.querySelectorAll('[data-add-btn]').forEach(el => el.addEventListener('click', () => {
      const status = el.getAttribute('data-add-btn');
      const input = root.querySelector(`[data-add-input="${status}"]`);
      addTask(monthKey(state.year, state.monthIndex), status, input.value);
      input.value = "";
    }));
    root.querySelectorAll('[data-add-input]').forEach(el => el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const status = el.getAttribute('data-add-input');
        addTask(monthKey(state.year, state.monthIndex), status, el.value);
        el.value = "";
      }
    }));
    root.querySelectorAll('[data-move]').forEach(el => el.addEventListener('click', () => moveTask(el.getAttribute('data-id'), parseInt(el.getAttribute('data-move'), 10))));
    root.querySelectorAll('[data-del]').forEach(el => el.addEventListener('click', () => deleteTask(el.getAttribute('data-del'))));
  }

  loadAll();
  setInterval(loadAll, 15000); // ดึงข้อมูลใหม่ทุก 15 วิ เผื่อมีงานเพิ่มจาก LINE
})();
</script>

</body>
</html>
